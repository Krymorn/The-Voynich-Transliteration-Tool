name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the tool with no optional extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # The core must work on a clean install. This step deliberately runs
      # before the optional extras are installed, so a hidden dependency on
      # matplotlib or tqdm fails the build instead of passing unnoticed.
      - name: Run the test suite without optional dependencies
        run: pytest -q

      - name: Check the tool runs end to end
        run: |
          python -m tvtt --version
          python -m tvtt sections
          python -m tvtt sources
          python -m tvtt verify
          python -m tvtt init
          python -m tvtt run --section zodiac --no-progress --quiet
          python -m tvtt doctor

      - name: Install the optional extras
        run: pip install -e ".[all]"

      - name: Run the test suite again with everything installed
        run: pytest -q

      - name: Check the plot and report plugins
        run: python -m tvtt run --section zodiac --plugin plots --plugin html_report --plugin bundle --no-progress --quiet

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Lint
        run: ruff check tvtt tests tools
      - name: Check formatting is consistent
        run: ruff format --check tvtt tests tools

  data:
    name: bundled data is intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" build
      - name: Verify transcription checksums
        run: python -m tvtt verify
      - name: Every bundled data file must survive packaging
        run: |
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist()
          required = {
              "data/transcriptions": 9,
              "data/dictionaries": 11,
              "data/controls": 11,
              "data/schema": 2,
              "data/fonts": 3,
          }
          failed = False
          for folder, expected in required.items():
              found = len([n for n in names if "/%s/" % folder in n])
              print("%-24s %d (expected at least %d)" % (folder, found, expected))
              if found < expected:
                  failed = True
          sys.exit(1 if failed else 0)
          PY
